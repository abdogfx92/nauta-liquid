<title>NAUTA — Freedive Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800;125,900;100,500;100,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ede7e1;--ink:#121417;--acc:#1f3fd1;--mute:#6d6a66}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Archivo,'Arial Black',sans-serif}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none}
.ui .btn,.ui nav span{pointer-events:auto;cursor:pointer}
nav{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px 44px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.logo{display:flex;align-items:center;gap:10px;font-stretch:125%;font-weight:900;font-size:17px;letter-spacing:.02em}.logo svg{width:22px}
.links{display:flex;gap:34px}
.pill{background:var(--acc);color:#fff;padding:10px 18px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.08em;transition:transform .3s}.pill:hover{transform:scale(1.05)}
.word{position:absolute;top:43%;font-stretch:125%;font-weight:900;font-size:min(9.6vw,200px);line-height:.8;letter-spacing:-.035em;text-transform:uppercase}
.w1{left:44px;color:var(--acc)}.w2{right:44px}
.sub{position:absolute;left:46px;top:calc(43% + min(9.6vw,200px)*.8 + 34px)}
.sub h3{font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;gap:18px;align-items:center;margin-top:20px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.row .pill{padding:11px 18px}
.mono{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hint{margin-top:22px;display:flex;gap:8px;align-items:center}.hint i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.card{position:absolute;right:44px;bottom:40px;width:210px}

const cv=document.getElementById('gl');
function fail(msg){console.error(msg);document.body.style.background='url('+IMG_A+') center/cover';const d=document.createElement('div');d.style.cssText='position:fixed;left:10px;bottom:10px;font:11px monospace;color:#900;z-index:9;background:#fff8;padding:4px 8px;border-radius:6px';d.textContent='WebGL: '+msg;document.body.appendChild(d);}

function run2D(){
 cv.style.display='none';const c=document.createElement('canvas');c.id='gl2d';c.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;display:block';cv.parentNode.insertBefore(c,cv);
 const x=c.getContext('2d');const off=document.createElement('canvas'),ox=off.getContext('2d');const mk=document.createElement('canvas'),mx=mk.getContext('2d');const mk2=document.createElement('canvas'),mx2=mk2.getContext('2d');
 let W,H,dpr,ia,ib;const MS=.2;
 function rs(){dpr=.6;W=innerWidth;H=innerHeight;c.width=off.width=W*dpr;c.height=off.height=H*dpr;mk.width=mk2.width=Math.ceil(W*MS);mk.height=mk2.height=Math.ceil(H*MS);}
 rs();addEventListener('resize',rs);
 const L=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s;});
 function cover(ctx,im){const rs=c.width/c.height,ri=im.width/im.height;let w,h;if(rs>ri){w=c.width;h=w/ri;}else{h=c.height;w=h*ri;}ctx.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h);}
 const pts=[];let lx=null,ly=null,T=0;
 function add(px,py){if(lx!==null){const d=Math.hypot(px-lx,py-ly),n=Math.max(1,Math.ceil(d/6));for(let i=1;i<=n;i++){const k=i/n;pts.push({x:lx+(px-lx)*k,y:ly+(py-ly)*k,a:0,vx:(px-lx)/n*.06,vy:(py-ly)/n*.06,s:Math.random()});}}lx=px;ly=py;}
 addEventListener('pointermove',e=>add(e.clientX,e.clientY),{passive:true});
 addEventListener('touchmove',e=>{const t=e.touches[0];add(t.clientX,t.clientY);},{passive:true});
 Promise.all([L(IMG_A),L(IMG_B)]).then(([A,B])=>{
  function frame(dt){T+=dt;
   if(DEMO){const k=T*1.1;add((.5+.075*Math.sin(k)+.03*Math.sin(k*2.7))*W,(1-(.66+.07*Math.sin(k*1.4+1.)+.02*Math.cos(k*3.1)))*H);}
   const LIFE=1.6,R=Math.min(W,H)*(W<700?.13:.075);
   for(const p of pts){p.a+=dt;const sw=Math.sin(p.y*.02+T*1.3+p.s*6)*.35,sv=Math.cos(p.x*.02-T*1.1+p.s*6)*.35;p.x+=p.vx*60*dt+sw;p.y+=p.vy*60*dt+sv;p.vx*=.96;p.vy*=.96;}
   while(pts.length&&(pts[0].a>LIFE||pts.length>360))pts.shift();
   // mask
   mx.clearRect(0,0,mk.width,mk.height);
   for(const p of pts){const k=1-p.a/LIFE,al=Math.pow(k,1.6)*.22,r=R*MS*(1+.5*(1-k));const g=mx.createRadialGradient(p.x*MS,p.y*MS,0,p.x*MS,p.y*MS,r);g.addColorStop(0,'rgba(0,0,0,'+al+')');g.addColorStop(1,'rgba(0,0,0,0)');mx.fillStyle=g;mx.beginPath();mx.arc(p.x*MS,p.y*MS,r,0,7);mx.fill();}
   x.globalCompositeOperation='source-over';cover(x,A);
   ox.globalCompositeOperation='source-over';ox.clearRect(0,0,off.width,off.height);mx2.clearRect(0,0,mk2.width,mk2.height);mx2.filter='blur(3px)';mx2.drawImage(mk,0,0);mx2.filter='none';ox.imageSmoothingQuality='high';ox.drawImage(mk2,0,0,off.width,off.height);
   ox.globalCompositeOperation='source-in';cover(ox,B);x.drawImage(off,0,0);
   // liquid sheen streaks
   x.save();x.scale(dpr,dpr);x.lineCap='round';
   const S=[];for(let i=0;i<pts.length;i+=4)S.push(pts[i]);
   for(let j=0;j<3;j++){const Q=S.map((p,i)=>{const a=S[Math.max(0,i-2)],b=S[Math.min(S.length-1,i+2)];let nx=-(b.y-a.y),ny=b.x-a.x;const nl=Math.hypot(nx,ny)||1;const o=(j-1)*R*.5+Math.sin(i*.35+T*1.5+j*2)*R*.15;return[p.x+nx/nl*o,p.y+ny/nl*o,1-p.a/LIFE];});
    for(let i=1;i<Q.length-1;i++){const p0=Q[i-1],p1=Q[i],p2=Q[i+1];x.beginPath();x.moveTo((p0[0]+p1[0])/2,(p0[1]+p1[1])/2);x.quadraticCurveTo(p1[0],p1[1],(p1[0]+p2[0])/2,(p1[1]+p2[1])/2);x.strokeStyle='rgba(255,255,255,'+(Math.pow(p1[2],1.5)*(.22-.05*j))+')';x.lineWidth=1.2+j*.7;x.stroke();}}

  window.__frames=n=>{for(let i=0;i<n;i++)frame(1/60);};
  let last=performance.now(),idle=0;function loop(now){const dt=Math.min((now-last)/1000,1/20);last=now;if(pts.length||DEMO||idle<2){frame(dt);idle=pts.length?0:idle+1;}requestAnimationFrame(loop);}
  if(STATIC)frame(1/60);else requestAnimationFrame(loop);window.__ready=true;});
}
const gl=cv.getContext('webgl2',{alpha:false,depth:false,stencil:false,antialias:false,preserveDrawingBuffer:true});
if(!gl||q.has('2d')){run2D();return;}
const hasFloat=!!gl.getExtension('EXT_color_buffer_float');gl.getExtension('OES_texture_float_linear');
const P={SIM:128,DYE:768,DENS_DISS:1.0,VEL_DISS:0.9,PRESSURE:0.8,ITER:20,CURL:12,RADIUS:0.0055,FORCE:1800};
const VS=`#version 300 es
precision highp float;in vec2 aP;out vec2 vUv,vL,vR,vT,vB;uniform vec2 tx;
void main(){vUv=aP*.5+.5;vL=vUv-vec2(tx.x,0);vR=vUv+vec2(tx.x,0);vT=vUv+vec2(0,tx.y);vB=vUv-vec2(0,tx.y);gl_Position=vec4(aP,0,1);}`;
const H=`#version 300 es
precision highp float;precision highp sampler2D;in vec2 vUv,vL,vR,vT,vB;out vec4 o;uniform vec2 tx;`;
const FS={
clear:H+`uniform sampler2D uT;uniform float v;void main(){o=v*texture(uT,vUv);}`,
splat:H+`uniform sampler2D uT;uniform float asp,r;uniform vec3 col;uniform vec2 pt;void main(){vec2 p=vUv-pt;p.x*=asp;vec3 s=exp(-dot(p,p)/r)*col;o=vec4(texture(uT,vUv).xyz+s,1);}`,
advect:H+`uniform sampler2D uV,uS;uniform vec2 stx;uniform float dt,diss;void main(){vec2 c=vUv-dt*texture(uV,vUv).xy*tx;o=texture(uS,c)/(1.+diss*dt);o.a=1.;}`,
div:H+`uniform sampler2D uV;void main(){float L=texture(uV,vL).x,R=texture(uV,vR).x,T=texture(uV,vT).y,B=texture(uV,vB).y;vec2 C=texture(uV,vUv).xy;if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0,0,1);}`,
curl:H+`uniform sampler2D uV;void main(){float L=texture(uV,vL).y,R=texture(uV,vR).y,T=texture(uV,vT).x,B=texture(uV,vB).x;o=vec4(.5*(R-L-T+B),0,0,1);}`,
vort:H+`uniform sampler2D uV,uC;uniform float curl,dt;void main(){float L=texture(uC,vL).x,R=texture(uC,vR).x,T=texture(uC,vT).x,B=texture(uC,vB).x,C=texture(uC,vUv).x;vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=curl*C;f.y*=-1.;vec2 v=texture(uV,vUv).xy+f*dt;o=vec4(clamp(v,-1000.,1000.),0,1);}`,
press:H+`uniform sampler2D uP,uD;void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x,d=texture(uD,vUv).x;o=vec4((L+R+B+T-d)*.25,0,0,1);}`,
grad:H+`uniform sampler2D uP,uV;void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;vec2 v=texture(uV,vUv).xy-vec2(R-L,T-B);o=vec4(v,0,1);}`,
show:H+`uniform sampler2D uA,uB,uD;uniform vec2 res,img,dtx;
vec2 cover(vec2 p){float rs=res.x/res.y,ri=img.x/img.y;vec2 s=rs>ri?vec2(1.,ri/rs):vec2(rs/ri,1.);return (p-.5)*s+.5;}
float D(vec2 p){return texture(uD,p).r;}
void main(){
 float d=D(vUv);
 vec2 e=dtx*6.;
 float dx=D(vUv+vec2(e.x,0))-D(vUv-vec2(e.x,0)),dy=D(vUv+vec2(0,e.y))-D(vUv-vec2(0,e.y));
 vec3 n=normalize(vec3(-dx*5.,-dy*5.,1.));
 float wet=smoothstep(.0,.12,d);
 vec2 off=n.xy*.006*wet;
 vec2 u=cover(vUv);
 vec3 a=texture(uA,u+off).rgb, b=texture(uB,u+off*.7).rgb;
 float m=smoothstep(.03,.95,d);
 vec3 col=mix(a,b,m);
 vec3 L=normalize(vec3(-.45,.65,.6));vec3 V=vec3(0,0,1);vec3 Hh=normalize(L+V);
 float sp=pow(max(dot(n,Hh),0.),220.)*wet;
 float sp2=pow(max(dot(n,normalize(vec3(.5,-.3,.8))),0.),300.)*wet*.4;
 float rim=smoothstep(.02,.25,1.-n.z)*wet;
 col+=vec3(1.)*(sp*.85+sp2*.8);
 o=vec4(col,1);}`
};
function S(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
let vsO;function Pg(fs){if(!vsO)vsO=S(gl.VERTEX_SHADER,VS);const p=gl.createProgram();gl.attachShader(p,vsO);gl.attachShader(p,S(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'aP');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));const U={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const nm=gl.getActiveUniform(p,i).name;U[nm]=gl.getUniformLocation(p,nm);}return{p,U};}
let PR={};try{for(const k in FS)PR[k]=Pg(FS[k]);}catch(e){fail(e.message);return;}
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,-1,1,1,1,1,-1]),gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,0,2,3]),gl.STATIC_DRAW);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
function fmt(){ // pick a renderable format
 const tryF=(ifmt,f,t)=>{const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.texImage2D(gl.TEXTURE_2D,0,ifmt,4,4,0,f,t,null);const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tx,0);const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)==gl.FRAMEBUFFER_COMPLETE;gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.deleteTexture(tx);gl.deleteFramebuffer(fb);return ok;};
 if(tryF(gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT))return[gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT];
 if(tryF(gl.RGBA32F,gl.RGBA,gl.FLOAT))return[gl.RGBA32F,gl.RGBA,gl.FLOAT];
 return null;}
const F=fmt();if(!F){fail('no float render targets (EXT_color_buffer_float='+hasFloat+')');return;}
function FBO(w,h){gl.activeTexture(gl.TEXTURE0);const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,F[0],w,h,0,F[1],F[2],null);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);gl.viewport(0,0,w,h);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);return{t,f,w,h,tx:[1/w,1/h],bind(u){gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t);return u;}};}
function DFBO(w,h){let a=FBO(w,h),b=FBO(w,h);return{get r(){return a},get w(){return b},swap(){[a,b]=[b,a]},W:w,H:h,tx:a.tx};}
function res(r){const asp=gl.drawingBufferWidth/gl.drawingBufferHeight;const mn=Math.round(r),mx=Math.round(r*(asp>1?asp:1/asp));return asp>1?[mx,mn]:[mn,mx];}
let dye,vel,divg,crl,prs;
function initFB(){const s=res(P.SIM),d=res(P.DYE);dye=DFBO(d[0],d[1]);vel=DFBO(s[0],s[1]);divg=FBO(s[0],s[1]);crl=FBO(s[0],s[1]);prs=DFBO(s[0],s[1]);}
function blit(t){if(t){gl.viewport(0,0,t.w,t.h);gl.bindFramebuffer(gl.FRAMEBUFFER,t.f);}else{gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight);gl.bindFramebuffer(gl.FRAMEBUFFER,null);}gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,0);}
let W,Hh;function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;Hh=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr);initFB();}
resize();addEventListener('resize',resize);
function use(k){gl.useProgram(PR[k].p);return PR[k].U;}
function splat(x,y,dx,dy){const asp=cv.width/cv.height;let U=use('splat');gl.uniform1i(U.uT,vel.r.bind(0));gl.uniform1f(U.asp,asp);gl.uniform2f(U.pt,x,y);gl.uniform3f(U.col,dx,dy,0);gl.uniform1f(U.r,P.RADIUS*(W<700?1.2:1));gl.uniform2fv(U.tx,vel.tx);blit(vel.w);vel.swap();
 U=use('splat');gl.uniform1i(U.uT,dye.r.bind(0));gl.uniform1f(U.asp,asp);gl.uniform2f(U.pt,x,y);gl.uniform3f(U.col,.32,0,0);gl.uniform1f(U.r,P.RADIUS*(W<700?1.2:1));gl.uniform2fv(U.tx,dye.tx);blit(dye.w);dye.swap();}
function step(dt){
 gl.disable(gl.BLEND);
 let U=use('curl');gl.uniform2fv(U.tx,vel.tx);gl.uniform1i(U.uV,vel.r.bind(0));blit(crl);
 U=use('vort');gl.uniform2fv(U.tx,vel.tx);gl.uniform1i(U.uV,vel.r.bind(0));gl.uniform1i(U.uC,crl.bind(1));gl.uniform1f(U.curl,P.CURL);gl.uniform1f(U.dt,dt);blit(vel.w);vel.swap();
 U=use('div');gl.uniform2fv(U.tx,vel.tx);gl.uniform1i(U.uV,vel.r.bind(0));blit(divg);
 U=use('clear');gl.uniform2fv(U.tx,prs.tx);gl.uniform1i(U.uT,prs.r.bind(0));gl.uniform1f(U.v,P.PRESSURE);blit(prs.w);prs.swap();
 U=use('press');gl.uniform2fv(U.tx,prs.tx);gl.uniform1i(U.uD,divg.bind(0));for(let i=0;i<P.ITER;i++){gl.uniform1i(U.uP,prs.r.bind(1));blit(prs.w);prs.swap();}
 U=use('grad');gl.uniform2fv(U.tx,vel.tx);gl.uniform1i(U.uP,prs.r.bind(0));gl.uniform1i(U.uV,vel.r.bind(1));blit(vel.w);vel.swap();
 U=use('advect');gl.uniform2fv(U.tx,vel.tx);gl.uniform1i(U.uV,vel.r.bind(0));gl.uniform1i(U.uS,vel.r.bind(0));gl.uniform1f(U.dt,dt);gl.uniform1f(U.diss,P.VEL_DISS);blit(vel.w);vel.swap();
 U=use('advect');gl.uniform2fv(U.tx,vel.tx);gl.uniform1i(U.uV,vel.r.bind(0));gl.uniform1i(U.uS,dye.r.bind(1));gl.uniform1f(U.dt,dt);gl.uniform1f(U.diss,P.DENS_DISS);blit(dye.w);dye.swap();}
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{gl.activeTexture(gl.TEXTURE0);const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,i);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);ok({t,w:i.naturalWidth,h:i.naturalHeight});};i.onerror=()=>no(new Error('image failed'));i.src=src;});}
// pointer
const ptr={x:0,y:0,px:0,py:0,moved:false,init:false};
function mv(cx,cy){const x=cx/W,y=1-cy/Hh;if(!ptr.init){ptr.px=x;ptr.py=y;ptr.init=true;}ptr.x=x;ptr.y=y;ptr.moved=true;}
addEventListener('pointermove',e=>mv(e.clientX,e.clientY),{passive:true});
addEventListener('mousemove',e=>mv(e.clientX,e.clientY),{passive:true});
addEventListener('touchmove',e=>{const t=e.touches[0];mv(t.clientX,t.clientY);},{passive:true});
Promise.all([loadImg(IMG_A),loadImg(IMG_B)]).then(([A,B])=>{
 let T=0;
 function frame(dt){T+=dt;
  if(DEMO){const k=T*1.1;const x=.5+.075*Math.sin(k)+.03*Math.sin(k*2.7),y=.66+.07*Math.sin(k*1.4+1.)+.02*Math.cos(k*3.1);mv(x*W,(1-y)*Hh);}
  if(ptr.moved){const dx=(ptr.x-ptr.px),dy=(ptr.y-ptr.py);const asp=cv.width/cv.height;
   const steps=Math.max(1,Math.min(8,Math.ceil(Math.hypot(dx*asp,dy)/0.006)));
   for(let i=1;i<=steps;i++){const t=i/steps;splat(ptr.px+dx*t,ptr.py+dy*t,dx*asp*P.FORCE/steps,dy*P.FORCE/steps);}
   ptr.px=ptr.x;ptr.py=ptr.y;ptr.moved=false;}
  step(dt);
  const U=use('show');gl.uniform2fv(U.tx,[1/cv.width,1/cv.height]);gl.uniform1i(U.uA,(gl.activeTexture(gl.TEXTURE0),gl.bindTexture(gl.TEXTURE_2D,A.t),0));gl.uniform1i(U.uB,(gl.activeTexture(gl.TEXTURE1),gl.bindTexture(gl.TEXTURE_2D,B.t),1));gl.uniform1i(U.uD,dye.r.bind(2));gl.uniform2f(U.res,W,Hh);gl.uniform2f(U.img,A.w,A.h);gl.uniform2fv(U.dtx,dye.tx);blit(null);}
 window.__frames=n=>{for(let i=0;i<n;i++)frame(1/60);};
 let last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,1/30);last=now;frame(dt);requestAnimationFrame(loop);}
 if(STATIC)frame(1/60);else requestAnimationFrame(loop);
 window.__ready=true;
}).catch(e=>fail(e.message));
})();
</script></body></html>
